model:
  model_type: qwen2_5_vl
  model_path: ${MODEL_PATH}
  dtype: bfloat16
  device_map: auto
  trust_remote_code: true
  local_files_only: true
  attn_implementation: eager

calibration:
  path: ${CALIB_JSONL}
  image_root: ${IMAGE_ROOT}

quant_joint:
  quant_lambda: 1.0
  quant_method: rtn
  rtn_bits: 4
  rtn_group_size: 0

pruning:
  retention_ratio: 0.5
  min_keep: 1

scoring:
  answer_source: sample
  per_token: true
  max_new_tokens: 16

visualization:
  limit: 1
  random_sample: true
  seed:
  image_overlay: true
  output_dir: outputs
  save_sample_artifacts: true
  sample_artifact_dir: samples
