[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prune-quant-baseline"
version = "0.1.0"
description = "Prune + quantization baseline scaffolding for MLLM visual token compression."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "transformers>=4.45",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "pandas>=2.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
quant = [
  "bitsandbytes>=0.43",
]
test = [
  "pytest>=8.0",
]

[project.entry-points."lmms_eval.models"]
prune_quant_baseline = "prune_quant_baseline.lmms_eval:lmms_eval_model_manifests"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
