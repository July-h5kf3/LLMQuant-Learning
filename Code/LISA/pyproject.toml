[project]
name = "lisa"
version = "0.1.0"
description = "Inference-focused LISA reproduction workspace"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "einops>=0.8.2",
    "numpy>=2.4.0",
    "opencv-python-headless>=4.10.0",
    "peft>=0.17.0",
    "pillow>=11.2.1",
    "pycocotools>=2.0.10",
    "pyyaml>=6.0.2",
    "tensorboard>=2.20.0",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "tqdm>=4.67.1",
    "transformers==5.4.0",
    "triton==3.5.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
