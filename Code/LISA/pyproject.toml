[project]
name = "lisa"
version = "0.1.0"
description = "Inference-focused LISA reproduction workspace"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "deepspeed>=0.18.1",
    "einops>=0.8.2",
    "fvcore>=0.1.5.post20221221",
    "matplotlib>=3.10.0",
    "mpi4py>=4.1.1",
    "numpy>=2.4.0",
    "opencv-python-headless>=4.10.0",
    "peft==0.7.1",
    "pillow>=11.2.1",
    "pycocotools>=2.0.10",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
    "scikit-image>=0.25.0",
    "scikit-learn>=1.8.0",
    "sentencepiece>=0.2.1",
    "tensorboard>=2.20.0",
    "tiktoken>=0.12.0",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "tqdm>=4.67.1",
    "transformers==5.3.0",
    "triton==3.5.1",
]

[project.optional-dependencies]
awq = [
    "gptqmodel==4.2.5",
    "logbar==0.0.4",
    "tokenicer>=0.0.12",
    "device-smi==0.4.1",
    "hf_transfer>=0.1.9",
    "random_word==1.0.13",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
