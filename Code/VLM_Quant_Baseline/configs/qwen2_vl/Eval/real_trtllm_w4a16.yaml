# TensorRT-LLM real-quant lmms-eval example for Qwen2-VL W4A16.
model: qwen2_vl
model_args: pretrained="Qwen/Qwen2-VL-7B-Instruct"

tasks: mmmu_val
batch_size: 1
log_samples: True
log_samples_suffix: trtllm_w4a16_mmmu_val

real_quant: True
inference_engine: trtllm
trtllm_model_path: /path/to/Qwen2-VL-7B-Instruct-W4A16-trtllm
trtllm_tokenizer_path: /path/to/Qwen2-VL-7B-Instruct
trtllm_backend: engine
trtllm_dtype: auto
trtllm_tensor_parallel_size: 1
trtllm_max_batch_size: 8
trtllm_max_num_tokens: 8192
trtllm_max_multimodal_len: 1296
trtllm_trust_remote_code: True
trtllm_image_data_format: pil
w_bit: 4
a_bit: 16

gen_kwargs: temperature=0,max_new_tokens=64
output_path: /your/output/log/path
